<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore — Your Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
  
  <style>
  .favorite-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: #94a3b8;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            outline: none;
            z-index: 10;

            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .book-card:hover .favorite-btn {
            opacity: 1;
        }

        .favorite-btn:hover {
            transform: scale(1.1);
            background: #ffffff;
        }

        .favorite-btn:not(.active):hover {
            color: #64748b;
        }

        .favorite-btn.active {
            color: #ef4444 !important;
        }

        .favorite-btn.active:hover {
            color: #dc2626 !important;
        }
  </style>
  
  
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="navbar">
    <div data-th-replace="~{fragments/navbar :: header}"></div>
</header>

<div class="app">

    <main id="main-content">

        <div class="controls-container">
            <form th:action="@{/sort}" method="get" class="sort-form">
                <div class="form-group">
                    <label for="bookField">დახარისხება:</label>
                    <select id="bookField" name="field" class="form-select">
                        <option value="price" th:selected="${param.field != null && param.field[0] == 'price'}">ფასი</option>
                        <option value="date" th:selected="${param.field != null && param.field[0] == 'date'}">დამატების დრო</option>
                        <option value="year" th:selected="${param.field != null && param.field[0] == 'year'}">გამოშვების წელი</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bookDirection">თანმიმდევრობა:</label>
                    <select id="bookDirection" name="direction" class="form-select">
                        <option value="asc" th:selected="${param.direction != null && param.direction[0] == 'asc'}">ზრდადობით </option>
                        <option value="desc" th:selected="${param.direction != null && param.direction[0] == 'desc'}">კლებადობით </option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">გაფილტვრა</button>
            </form>

            <div class="search-panel">
                <form id="searchForm" class="search-panel-form">
                    <div class="form-group form-group--wide">
                        <label for="searchTitle">წიგნის სახელი (Title)</label>
                        <input type="text" id="searchTitle" class="form-input" placeholder="ჩაწერეთ სათაური...">
                    </div>

                    <div class="form-group">
                        <label for="filterGenre">ჟანრი (Genre)</label>
                        <select id="filterGenre" class="form-select">
                            <option value="">ყველა ჟანრი</option>
                            <option value="Fiction">Fiction</option>
                            <option value="Dystopian">Dystopian</option>
                            <option value="Classic">Classic</option>
                            <option value="Fantasy">Fantasy</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="filterYear">წელი (Year)</label>
                        <input type="number" id="filterYear" class="form-input" placeholder="წელი" min="1000" max="2026">
                    </div>

                    <div style="display: flex; gap: 0.5rem;">
                        <button type="submit" class="btn-search">ძებნა</button>
                        <button type="button" id="resetSearch" class="btn-reset">გასუფთავება</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="bookGrid" class="book-grid" aria-live="polite" th:style="${allBooks == null || allBooks.isEmpty()} ? 'display: none;' : 'display: grid;'">
            <th:block th:if="${allBooks != null}">
                <article class="book-card" th:each="book : ${allBooks}">
                  
                  <button class="favorite-btn"
                        th:classappend="${book.isFavorite} ? 'active' : ''"
                        th:data-id="${book.id}"
                        onclick="toggleFavorite(this)">
                    <span class="heart-icon" th:text="${book.isFavorite ? '♥' : '♡'}">♡</span>
                </button>
                  
                    <a th:href="@{/books/details/{id}(id=${book.id})}">
                        <img class="book-card__cover"
                             th:src="${book.imageUrl != null && !book.imageUrl.isEmpty()} ? ${book.imageUrl} : '/images/default-book.png'"
                             th:alt="'Cover of ' + ${book.title}">

                        <h3 class="book-card__title" th:text="${book.title}">Book Title</h3>
                        <p class="book-card__author" th:text="${book.author}">Author Name</p>
                        <p class="book-card__description" th:text="${book.description}">Short description goes here...</p>
                        <div class="book-card__price">
                            <span th:text="${book.price}">0.00</span> ₾
                        </div>
                    </a>
                </article>
            </th:block>
        </div>

        <div class="empty-state" id="emptyState" th:style="${allBooks == null || allBooks.isEmpty()} ? 'display: flex;' : 'display: none;'">
            <h2>No books here yet</h2>
            <p>Add a book to this shelf and it will show up here.</p>
        </div>
    </main>

</div>

<footer class="site-footer">
    <div class="site-footer__bottom">
        <span>© 2026 Stacks. All rights reserved.</span>
        <div class="site-footer__socials">
            <a href="#" aria-label="Twitter / X">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20"/></svg>
            </a>
            <a href="#" aria-label="Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg>
            </a>
            <a href="#" aria-label="GitHub">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 00-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.1-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.6 0 0 .8-.3 2.7 1a9.3 9.3 0 015 0c1.9-1.3 2.7-1 2.7-1 .5 1.3.2 2.3.1 2.6.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0012 2z"/></svg>
            </a>
        </div>
    </div>
</footer>

<script src="/js/app.js"></script>

</body>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const favoriteButtons = document.querySelectorAll(".favorite-btn");
        if (favoriteButtons.length === 0) return;


        for (const button of favoriteButtons) {
            const bookId = button.getAttribute("data-id");
            const heartIcon = button.querySelector(".heart-icon");

            try {
                const response = await fetch(`/books/${bookId}`);
                if (response.ok) {
                    const bookData = await response.json();

                    const isFav = bookData.favorite || bookData.isFavorite;

                    if (isFav) {
                        button.classList.add("active");
                        heartIcon.textContent = "♥";
                        console.log(`წიგნი ID: ${bookId} დაფავორიტებულია. გული გაწითლდა!`);
                    }
                }
            } catch (error) {
                console.error(`შეცდომა ID: ${bookId} წიგნის შემოწმებისას:`, error);
            }
        }
    });

    async function toggleFavorite(button) {
        if (window.event) {
            window.event.preventDefault();
            window.event.stopPropagation();
        }

        const bookId = button.getAttribute("data-id");
        const heartIcon = button.querySelector(".heart-icon");

        try {
            const response = await fetch(`/api/favorites/toggle/${bookId}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            });

            if (response.redirected || response.status === 401 ||
                response.status === 403 || response.url.includes('/login')) {
                alert("გთხოვთ, გაიაროთ ავტორიზაცია ფავორიტებში დასამატებლად!");
                window.location.href = "/login";
                return;
            }

            if (response.ok) {
                const data = await response.json();
                if (data.isFavorite) {
                    button.classList.add("active");
                    heartIcon.textContent = "♥";
                } else {
                    button.classList.remove("active");
                    heartIcon.textContent = "♡";
                }
            }
        } catch (error) {
            console.error("შეცდომა:", error);
        }
    }
</script>

</html>
