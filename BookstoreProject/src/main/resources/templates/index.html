<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacks — Your Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{
            --paper:      #F1ECE1;   /* soft warm grey-paper background */
            --paper-dim:  #E7E0D1;   /* card / panel background */
            --ink:        #211C16;   /* primary text */
            --ink-soft:   #6B6255;   /* secondary text */
            --rule:       #C9BEA8;   /* hairline rule / catalog-card lines */
            --spine-red:  #7B2D26;   /* book-cloth red — primary accent */
            --spine-green:#2F4538;   /* forest green — secondary accent */
            --gold:       #B8862E;   /* foil gold — tertiary accent */
            --white:      #FBF9F4;

            --display: 'Fraunces', serif;
            --body: 'Inter', sans-serif;
            --mono: 'IBM Plex Mono', monospace;

            --radius: 3px;
            --nav-h: 72px;
        }

        *{ box-sizing:border-box; margin:0; padding:0; }

        html{ scroll-behavior:smooth; }

        body{
            background:var(--paper);
            color:var(--ink);
            font-family:var(--body);
            line-height:1.5;
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }

        a{ color:inherit; text-decoration:none; }
        ul{ list-style:none; }
        button{ font-family:inherit; cursor:pointer; }

        :focus-visible{
            outline:2px solid var(--spine-red);
            outline-offset:2px;
        }

        .visually-hidden{
            position:absolute; width:1px; height:1px;
            overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;
        }

        /* ---------- Skip link ---------- */
        .skip-link{
            position:absolute; left:-999px; top:0;
            background:var(--spine-red); color:var(--white);
            padding:.75rem 1.25rem; z-index:200; border-radius:0 0 var(--radius) 0;
        }
        .skip-link:focus{ left:0; }

        /* ---------- Navbar wrapper ---------- */
        .navbar{
            position:sticky;
            top:0;
            z-index:100;
            background:var(--paper);
            border-bottom:1px solid var(--rule);
        }

        /* ---------- Page layout ---------- */
        .app{
            display:flex;
            flex-direction:column;
            flex:1 0 auto;
        }

        /* ---------- Main content / grid container ---------- */
        main{
            flex:1 0 auto;
            max-width:1280px;
            width:100%;
            margin:0 auto;
            padding:2rem clamp(1rem, 4vw, 2.5rem) 4rem;
        }

        #bookGrid.book-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(168px, 1fr));
            gap:clamp(1.25rem, 2.5vw, 1.75rem) clamp(1rem, 2vw, 1.5rem);
            min-height:220px;
        }

        .favorite-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: #94a3b8;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            outline: none;
            z-index: 10;

            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .book-card:hover .favorite-btn {
            opacity: 1;
        }

        .favorite-btn:hover {
            transform: scale(1.1);
            background: #ffffff;
        }

        .favorite-btn:not(.active):hover {
            color: #64748b;
        }

        .favorite-btn.active {
            color: #ef4444 !important;
        }

        .favorite-btn.active:hover {
            color: #dc2626 !important;
        }

        .book-card--skeleton{
            display:flex;
            flex-direction:column;
            gap:.6rem;
        }
        .book-card--skeleton .cover-skeleton{
            aspect-ratio:2/3;
            width:100%;
            border-radius:var(--radius);
            background:linear-gradient(100deg, var(--paper-dim) 30%, #EFE8D9 45%, var(--paper-dim) 60%);
            background-size:200% 100%;
            animation:shimmer 1.6s ease-in-out infinite;
            border:1px solid var(--rule);
        }
        .line-skeleton{
            height:10px;
            border-radius:2px;
            background:var(--paper-dim);
        }
        .line-skeleton--wide{ width:85%; }
        .line-skeleton--narrow{ width:55%; }

        @keyframes shimmer{
            0%{ background-position:200% 0; }
            100%{ background-position:-200% 0; }
        }

        /* Empty-state message */
        .empty-state{
            display:none;
            flex-direction:column;
            align-items:center;
            text-align:center;
            gap:.75rem;
            padding:4rem 1rem;
            border:1px dashed var(--rule);
            border-radius:var(--radius);
            color:var(--ink-soft);
        }
        .empty-state h2{
            font-family:var(--display);
            font-weight:600;
            color:var(--ink);
            font-size:1.3rem;
        }

        @media (prefers-reduced-motion: reduce){
            .book-card--skeleton .cover-skeleton{ animation:none; }
            html{ scroll-behavior:auto; }
        }

        .book-card__description {
            font-size: 0.8rem;
            color: var(--ink-soft);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 0.2rem;
        }

        .book-card__price {
            font-family: var(--mono);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--spine-red);
            margin-top: auto;
            padding-top: 0.5rem;
        }

        .book-card:hover {
            transform: translateY(-4px);
        }
        .book-card__cover {
            aspect-ratio: 2/3;
            width: 100%;
            object-fit: cover;
            border-radius: var(--radius);
            border: 1px solid var(--rule);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .book-card__title {
            font-family: var(--display);
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.2;
            color: var(--ink);
        }
        .book-card__author {
            font-size: 0.85rem;
            color: var(--ink-soft);
        }

        /* ---------- Footer ---------- */
        .site-footer{
            flex-shrink:0;
            background:var(--ink);
            color:#D9D2C4;
            margin-top:auto;
        }
        .site-footer__bottom{
            padding:1.25rem clamp(1rem, 4vw, 2.5rem);
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:1rem;
            flex-wrap:wrap;
            font-size:.8rem;
            color:#8A8172;
        }
        .site-footer__socials{ display:flex; gap:.9rem; }
        .site-footer__socials a{
            width:32px; height:32px;
            display:flex; align-items:center; justify-content:center;
            border:1px solid #3A3327;
            border-radius:50%;
            color:#D9D2C4;
        }
        .site-footer__socials a:hover{ border-color:var(--gold); color:var(--gold); }
        .site-footer__socials svg{ width:15px; height:15px; stroke:currentColor; fill:none; }
    </style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="navbar">
    <div data-th-replace="~{fragments/navbar :: header}"></div>
</header>

<form th:action="@{/sort}" method="get" style="margin: 20px 0; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">

    <div>
        <label for="bookField" style="margin-right: 5px;">დახარისხება:</label>
        <select id="bookField" name="field" class="form-select" style="padding: 8px; border-radius: 5px; min-width: 150px;">
            <option value="price" th:selected="${param.field != null && param.field[0] == 'price'}">ფასი</option>
            <option value="date" th:selected="${param.field != null && param.field[0] == 'date'}">დამატების დრო</option>
            <option value="year" th:selected="${param.field != null && param.field[0] == 'year'}">გამოშვების წელი</option>
        </select>
    </div>

    <div>
        <label for="bookDirection" style="margin-right: 5px;">თანმიმდევრობა:</label>
        <select id="bookDirection" name="direction" class="form-select" style="padding: 8px; border-radius: 5px; min-width: 150px;">
            <option value="asc" th:selected="${param.direction != null && param.direction[0] == 'asc'}">ზრდადობით </option>
            <option value="desc" th:selected="${param.direction != null && param.direction[0] == 'desc'}">კლებადობით </option>
        </select>
    </div>

    <button type="submit" class="btn" style="padding: 8px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
        გაფილტვრა
    </button>
</form>


<div class="app">

    <main id="main-content">
        <div id="bookGrid" class="book-grid" aria-live="polite" th:if="${allBooks != null && !allBooks.isEmpty()}">

            <article class="book-card" th:each="book : ${allBooks}" style="position: relative;">

                <button class="favorite-btn"
                        th:classappend="${book.isFavorite} ? 'active' : ''"
                        th:data-id="${book.id}"
                        onclick="toggleFavorite(this)">
                    <span class="heart-icon" th:text="${book.isFavorite ? '♥' : '♡'}">♡</span>
                </button>

                <a th:href="@{/books/details/{id}(id=${book.id})}">
                    <img class="book-card__cover"
                         th:src="${book.imageUrl != null && !book.imageUrl.isEmpty()} ? ${book.imageUrl} : '/images/default-book.png'"
                         th:alt="'Cover of ' + ${book.title}">

                    <h3 class="book-card__title" th:text="${book.title}">Book Title</h3>
                    <p class="book-card__author" th:text="${book.author}">Author Name</p>
                    <p class="book-card__description" th:text="${book.description}">Short description goes here...</p>
                    <div class="book-card__price">
                        <span th:text="${book.price}">0.00</span> ₾
                    </div>
                </a>
            </article>
        </div>

        <div class="empty-state" id="emptyState" th:if="${allBooks == null || allBooks.isEmpty()}" style="display: flex;">
            <h2>No books here yet</h2>
            <p>Add a book to this shelf and it will show up here.</p>
        </div>
    </main>

</div>

<footer class="site-footer">
    <div class="site-footer__bottom">
        <span>© 2026 Stacks. All rights reserved.</span>
        <div class="site-footer__socials">
            <a href="#" aria-label="Twitter / X">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20"/></svg>
            </a>
            <a href="#" aria-label="Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg>
            </a>
            <a href="#" aria-label="GitHub">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 00-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.1-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.6 0 0 .8-.3 2.7 1a9.3 9.3 0 015 0c1.9-1.3 2.7-1 2.7-1 .5 1.3.2 2.3.1 2.6.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0012 2z"/></svg>
            </a>
        </div>
    </div>
</footer>

<script src="/js/app.js"></script>

</body>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const favoriteButtons = document.querySelectorAll(".favorite-btn");
        if (favoriteButtons.length === 0) return;


        for (const button of favoriteButtons) {
            const bookId = button.getAttribute("data-id");
            const heartIcon = button.querySelector(".heart-icon");

            try {
                const response = await fetch(`/books/${bookId}`);
                if (response.ok) {
                    const bookData = await response.json();

                    const isFav = bookData.favorite || bookData.isFavorite;

                    if (isFav) {
                        button.classList.add("active");
                        heartIcon.textContent = "♥";
                        console.log(`წიგნი ID: ${bookId} დაფავორიტებულია. გული გაწითლდა!`);
                    }
                }
            } catch (error) {
                console.error(`შეცდომა ID: ${bookId} წიგნის შემოწმებისას:`, error);
            }
        }
    });

    async function toggleFavorite(button) {
        if (window.event) {
            window.event.preventDefault();
            window.event.stopPropagation();
        }

        const bookId = button.getAttribute("data-id");
        const heartIcon = button.querySelector(".heart-icon");

        try {
            const response = await fetch(`/api/favorites/toggle/${bookId}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            });

            if (response.redirected || response.status === 401 ||
                response.status === 403 || response.url.includes('/login')) {
                alert("გთხოვთ, გაიაროთ ავტორიზაცია ფავორიტებში დასამატებლად!");
                window.location.href = "/login";
                return;
            }

            if (response.ok) {
                const data = await response.json();
                if (data.isFavorite) {
                    button.classList.add("active");
                    heartIcon.textContent = "♥";
                } else {
                    button.classList.remove("active");
                    heartIcon.textContent = "♡";
                }
            }
        } catch (error) {
            console.error("შეცდომა:", error);
        }
    }
</script>

</html>
