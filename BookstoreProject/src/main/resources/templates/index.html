<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacks — Your Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{
          --paper:      #F1ECE1;   /* soft warm grey-paper background */
          --paper-dim:  #E7E0D1;   /* card / panel background */
          --ink:        #211C16;   /* primary text */
          --ink-soft:   #6B6255;   /* secondary text */
          --rule:       #C9BEA8;   /* hairline rule / catalog-card lines */
          --spine-red:  #7B2D26;   /* book-cloth red — primary accent */
          --spine-green:#2F4538;   /* forest green — secondary accent */
          --gold:       #B8862E;   /* foil gold — tertiary accent */
          --white:      #FBF9F4;

          --display: 'Fraunces', serif;
          --body: 'Inter', sans-serif;
          --mono: 'IBM Plex Mono', monospace;

          --radius: 3px;
          --nav-h: 72px;
        }

        *{ box-sizing:border-box; margin:0; padding:0; }

        html{ scroll-behavior:smooth; }

        body{
          background:var(--paper);
          color:var(--ink);
          font-family:var(--body);
          line-height:1.5;
          min-height:100vh;
          display:flex;
          flex-direction:column;
        }

        a{ color:inherit; text-decoration:none; }
        ul{ list-style:none; }
        button{ font-family:inherit; cursor:pointer; }

        :focus-visible{
          outline:2px solid var(--spine-red);
          outline-offset:2px;
        }

        .visually-hidden{
          position:absolute; width:1px; height:1px;
          overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;
        }

        /* ---------- Skip link ---------- */
        .skip-link{
          position:absolute; left:-999px; top:0;
          background:var(--spine-red); color:var(--white);
          padding:.75rem 1.25rem; z-index:200; border-radius:0 0 var(--radius) 0;
        }
        .skip-link:focus{ left:0; }

        /* ---------- Navbar wrapper ---------- */
        .navbar{
          position:sticky;
          top:0;
          z-index:100;
          background:var(--paper);
          border-bottom:1px solid var(--rule);
        }

        /* ---------- Page layout ---------- */
        .app{
          display:flex;
          flex-direction:column;
          flex:1 0 auto;
        }

        /* ---------- Main content / grid container ---------- */
        main{
          flex:1 0 auto;
          max-width:1280px;
          width:100%;
          margin:0 auto;
          padding:2rem clamp(1rem, 4vw, 2.5rem) 4rem;
        }

        /* Empty, ready-to-populate grid */
        #bookGrid.book-grid{
          display:grid;
          grid-template-columns:repeat(auto-fill, minmax(168px, 1fr));
          gap:clamp(1.25rem, 2.5vw, 1.75rem) clamp(1rem, 2vw, 1.5rem);
          min-height:220px;
        }

        /* Placeholder skeleton state — shown while books are being fetched */
        .book-card--skeleton{
          display:flex;
          flex-direction:column;
          gap:.6rem;
        }
        .book-card--skeleton .cover-skeleton{
          aspect-ratio:2/3;
          width:100%;
          border-radius:var(--radius);
          background:linear-gradient(100deg, var(--paper-dim) 30%, #EFE8D9 45%, var(--paper-dim) 60%);
          background-size:200% 100%;
          animation:shimmer 1.6s ease-in-out infinite;
          border:1px solid var(--rule);
        }
        .line-skeleton{
          height:10px;
          border-radius:2px;
          background:var(--paper-dim);
        }
        .line-skeleton--wide{ width:85%; }
        .line-skeleton--narrow{ width:55%; }

        @keyframes shimmer{
          0%{ background-position:200% 0; }
          100%{ background-position:-200% 0; }
        }

        /* Empty-state message */
        .empty-state{
          display:none;
          flex-direction:column;
          align-items:center;
          text-align:center;
          gap:.75rem;
          padding:4rem 1rem;
          border:1px dashed var(--rule);
          border-radius:var(--radius);
          color:var(--ink-soft);
        }
        .empty-state h2{
          font-family:var(--display);
          font-weight:600;
          color:var(--ink);
          font-size:1.3rem;
        }

        @media (prefers-reduced-motion: reduce){
          .book-card--skeleton .cover-skeleton{ animation:none; }
          html{ scroll-behavior:auto; }
        }

        /* ---------- Footer ---------- */
        .site-footer{
          flex-shrink:0;
          background:var(--ink);
          color:#D9D2C4;
          margin-top:auto;
        }
        .site-footer__bottom{
          padding:1.25rem clamp(1rem, 4vw, 2.5rem);
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:1rem;
          flex-wrap:wrap;
          font-size:.8rem;
          color:#8A8172;
        }
        .site-footer__socials{ display:flex; gap:.9rem; }
        .site-footer__socials a{
          width:32px; height:32px;
          display:flex; align-items:center; justify-content:center;
          border:1px solid #3A3327;
          border-radius:50%;
          color:#D9D2C4;
        }
        .site-footer__socials a:hover{ border-color:var(--gold); color:var(--gold); }
        .site-footer__socials svg{ width:15px; height:15px; stroke:currentColor; fill:none; }
    </style>
</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>

<header class="navbar">
    <div data-th-replace="~{fragments/navbar :: header}"></div>
</header>

<div class="app">

    <main id="main-content">

        <div id="bookGrid" class="book-grid" aria-live="polite" aria-busy="true">
            <div class="book-card--skeleton" aria-hidden="true">
                <div class="cover-skeleton"></div>
                <div class="line-skeleton line-skeleton--wide"></div>
                <div class="line-skeleton line-skeleton--narrow"></div>
            </div>
            <div class="book-card--skeleton" aria-hidden="true">
                <div class="cover-skeleton"></div>
                <div class="line-skeleton line-skeleton--wide"></div>
                <div class="line-skeleton line-skeleton--narrow"></div>
            </div>
            <div class="book-card--skeleton" aria-hidden="true">
                <div class="cover-skeleton"></div>
                <div class="line-skeleton line-skeleton--wide"></div>
                <div class="line-skeleton line-skeleton--narrow"></div>
            </div>
            <div class="book-card--skeleton" aria-hidden="true">
                <div class="cover-skeleton"></div>
                <div class="line-skeleton line-skeleton--wide"></div>
                <div class="line-skeleton line-skeleton--narrow"></div>
            </div>
            <div class="book-card--skeleton" aria-hidden="true">
                <div class="cover-skeleton"></div>
                <div class="line-skeleton line-skeleton--wide"></div>
                <div class="line-skeleton line-skeleton--narrow"></div>
            </div>
            <div class="book-card--skeleton" aria-hidden="true">
                <div class="cover-skeleton"></div>
                <div class="line-skeleton line-skeleton--wide"></div>
                <div class="line-skeleton line-skeleton--narrow"></div>
            </div>
        </div>

        <div class="empty-state" id="emptyState">
            <h2>No books here yet</h2>
            <p>Add a book to this shelf and it will show up here.</p>
        </div>

    </main>

</div>

<footer class="site-footer">
    <div class="site-footer__bottom">
        <span>© 2026 Stacks. All rights reserved.</span>
        <div class="site-footer__socials">
            <a href="#" aria-label="Twitter / X">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20"/></svg>
            </a>
            <a href="#" aria-label="Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg>
            </a>
            <a href="#" aria-label="GitHub">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 00-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.1-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.6 0 0 .8-.3 2.7 1a9.3 9.3 0 015 0c1.9-1.3 2.7-1 2.7-1 .5 1.3.2 2.3.1 2.6.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0012 2z"/></svg>
            </a>
        </div>
    </div>
</footer>

<script src="/js/app.js"></script>

<script>
    const bookGrid = document.getElementById('bookGrid');
    const emptyState = document.getElementById('emptyState');

    // Ready for backhand.
    function renderBookCards(books) {
      bookGrid.setAttribute('aria-busy', 'false');
      bookGrid.innerHTML = '';

      if (!books || books.length === 0) {
        bookGrid.style.display = 'none';
        emptyState.style.display = 'flex';
        return;
      }

      books.forEach(book => {
        const card = document.createElement('article');
        card.className = 'book-card';
        card.dataset.bookId = book.id;
        card.innerHTML = `
          <a href="/book.html?id=${book.id}">
            <img class="book-card__cover" src="${book.cover}" alt="Cover of ${book.title}">
            <h3 class="book-card__title">${book.title}</h3>
            <p class="book-card__author">${book.author}</p>
          </a>`;
        bookGrid.appendChild(card);
      });
    }

    window.renderBookCards = renderBookCards;
</script>

</body>
</html>
