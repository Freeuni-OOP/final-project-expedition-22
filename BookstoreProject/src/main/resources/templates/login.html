<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bookstore - შესვლა</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<div data-th-replace="~{fragments/navbar :: header}"></div>

<div class="login-container">
    <h2>შესვლა</h2>

    <p th:if="${param.error}" style="color: #dc3545; text-align: center; font-size: 14px;">
        მომხმარებლის სახელი ან პაროლი არასწორია
    </p>
    <p th:if="${param.logout}" style="color: #28a745; text-align: center; font-size: 14px;">
        თქვენ წარმატებით გამოხვედით სისტემიდან
    </p>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">მომხმარებლის სახელი</label>
            <input type="text" id="username" name="username"
                   placeholder="ჩაწერეთ მომხმარებლის სახელი"
                   required
                   oninvalid="this.setCustomValidity('გთხოვთ, შეავსოთ ეს ველი')"
                   oninput="this.setCustomValidity('')">
        </div>

        <div class="form-group">
            <label for="password">პაროლი</label>
            <input type="password" id="password" name="password"
                   placeholder="შეიყვანეთ თქვენი პაროლი"
                   required
                   oninvalid="this.setCustomValidity('გთხოვთ, შეავსოთ ეს ველი')"
                   oninput="this.setCustomValidity('')">
        </div>

        <button type="submit" class="btn-submit">შესვლა</button>
    </form>

    <p>
        <a th:href="@{/register}">არ გაქვთ ანგარიში? რეგისტრაცია</a>
    </p>
</div>

</body>
</html>
