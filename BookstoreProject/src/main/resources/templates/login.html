<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bookstore - შესვლა</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<div data-th-replace="~{fragments/navbar :: header}"></div>

<div class="login-container">
    <h2>შესვლა</h2>

    <form id="login-form">
        <div class="form-group">
            <label for="username">მომხმარებლის სახელი</label>
            <input type="text" id="username" name="username"
                   placeholder="ჩაწერეთ მომხმარებლის სახელი"
                   required
                   oninvalid="this.setCustomValidity('გთხოვთ, შეავსოთ ეს ველი')"
                   oninput="this.setCustomValidity('')">
            <span class="field-error" id="username-error"></span>
        </div>

        <div class="form-group">
            <label for="password">პაროლი</label>
            <input type="password" id="password" name="password"
                   placeholder="შეიყვანეთ თქვენი პაროლი"
                   required
                   oninvalid="this.setCustomValidity('გთხოვთ, შეავსოთ ეს ველი')"
                   oninput="this.setCustomValidity('')">
            <span class="field-error" id="password-error"></span>
        </div>

        <button type="submit" class="btn-submit">შესვლა</button>
    </form>

    <p>
        <a th:href="@{/register}">არ გაქვთ ანგარიში? რეგისტრაცია</a>
    </p>
</div>

<script th:src="@{/js/login.js}" src="/js/login.js"></script>

</body>
</html>
