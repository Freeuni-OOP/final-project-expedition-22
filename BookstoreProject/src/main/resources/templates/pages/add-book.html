<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <link rel="stylesheet" href="/css/add-book.css">
</head>
<body>

<div class="container">
    <h1>Add New Book</h1>

    <form id="addBookForm">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>

        <label for="author">Author</label>
        <input type="text" id="author" name="author" required>

        <label for="genre">Genre</label>
        <input type="text" id="genre" name="genre" required>

        <label for="releaseYear">Release Year</label>
        <input type="number" id="releaseYear" name="releaseYear" required>

        <label for="price">Price</label>
        <input type="number" id="price" name="price" step="0.01" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" required></textarea>

        <label for="image">Book Image</label>
        <input type="file" id="image" name="image" accept="image/png, image/jpeg, image/jpg" required>

        <img id="imagePreview" class="image-preview" alt="Image preview">

        <button type="submit">Create Book</button>
    </form>

    <p id="message"></p>
</div>

<script src="/js/add-book.js"></script>
</body>
</html>
